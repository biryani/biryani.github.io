# Positions for the research map on the home page.
#
# Each paper carries three weights. They are normalised and used as barycentric
# coordinates over the triangle formed by the three circle centres, so a paper
# weighted purely to one field lands on that circle's centre and an evenly
# weighted one lands in the middle. Only the ratio between the weights matters.
#
# `nudge` is a purely cosmetic pixel offset applied after that placement, used
# to separate papers that would otherwise be drawn on top of each other. It
# never moves a dot out of the Venn region its weights put it in.
#
# `label` names each link and `url` points to the publisher where available,
# otherwise to the preprint. Keep these links current when papers are published.

geometry:
  width: 352
  height: 410
  centre_x: 176
  centre_y: 227
  radius: 105
  # Centre-to-centre distance as a multiple of the radius. Must stay inside
  # (1.155, 1.732): below that range two-field papers get swallowed by the
  # triple-overlap region, above it the triple-overlap region stops existing.
  separation: 1.35

